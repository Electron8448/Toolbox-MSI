name: Publish Windows MSI

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify tag and MSI version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Run this workflow on a version tag matching package.json, such as v1.1.0.'
          }
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run make:msi
      - name: Keep installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Toolbox-Windows-MSI
          path: |
            out/make/wix/x64/Toolbox-*.msi
            out/make/wix/x64/Toolbox-*.msi.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $msi = "out/make/wix/x64/Toolbox-$version.msi"
          $checksum = "$msi.sha256"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $msi $checksum --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $msi $checksum --verify-tag --title "Toolbox $version" --notes-file versions/README.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }
